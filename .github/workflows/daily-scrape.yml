name: Daily Nam Dinh result

on:
  schedule:
    # GitHub schedules use UTC. 06:45 UTC is 13:45 Indochina Time (UTC+7).
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: First date to check (YYYY-MM-DD)
        required: false
        default: "2020-04-02"
      end_date:
        description: Last date to check; blank means today in Indochina Time
        required: false
        default: ""
      delay:
        description: Delay between page requests in seconds
        required: false
        default: "0.6"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-scrape.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: nam-dinh-result-writer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect missing results
        id: collect
        shell: bash
        env:
          START_DATE: ${{ github.event.inputs.start_date || '2020-04-02' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          REQUEST_DELAY: ${{ github.event.inputs.delay || '0.6' }}
        run: |
          set +e
          command=(python -m result_scraper
            --start-date "$START_DATE"
            --output outputs/result_scraping/nam_dinh_results.xlsx
            --delay "$REQUEST_DELAY"
            --checkpoint-every 25)
          if [[ -n "$END_DATE" ]]; then
            command+=(--end-date "$END_DATE")
          fi
          "${command[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit workbook checkpoints
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- outputs/result_scraping/nam_dinh_results.xlsx; then
            echo "Workbook is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/result_scraping/nam_dinh_results.xlsx
          git commit -m "data: update Nam Dinh lottery results"
          git push

      - name: Report missing dates
        if: steps.collect.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "One or more dates remain missing. Saved results were committed and the next run will retry only missing dates."
          exit 1
