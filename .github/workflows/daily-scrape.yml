name: Daily Nam Dinh result

on:
  schedule:
    # GitHub schedules use UTC. 06:45 UTC is 13:45 Indochina Time (UTC+7).
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: First date to check (YYYY-MM-DD)
        required: false
        default: "2020-04-02"
      end_date:
        description: Last date to check; blank means today in Indochina Time
        required: false
        default: ""
      delay:
        description: Delay between page requests in seconds
        required: false
        default: "0.6"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-scrape.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: nam-dinh-result-writer
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Phnom_Penh
      PYTHONUNBUFFERED: "1"
      THINHNAM_PROXY_URL: ${{ secrets.THINHNAM_PROXY_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Start automatic Tor network route
        if: env.THINHNAM_PROXY_URL == ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor torsocks
          tor_started_at="$(date --utc '+%Y-%m-%d %H:%M:%S UTC')"
          sudo systemctl restart tor@default.service

          for attempt in {1..90}; do
            tor_logs="$(sudo journalctl -u tor@default.service \
              --since "$tor_started_at" --no-pager)"
            if [[ "$tor_logs" == *"Bootstrapped 100%"* ]]; then
              echo "Tor is fully bootstrapped."
              exit 0
            fi
            sleep 2
          done

          echo "Tor did not fully bootstrap within three minutes." >&2
          sudo journalctl -u tor@default.service --no-pager -n 50
          exit 1

      - name: Check official-site connectivity
        shell: bash
        run: |
          set -euo pipefail
          site_check=(python -m result_scraper
            --start-date 2026-08-11
            --end-date 2026-08-11
            --output "$RUNNER_TEMP/thinhnam-connectivity.xlsx"
            --delay 0
            --timeout 20
            --max-attempts 1)

          if [[ -n "${THINHNAM_PROXY_URL:-}" ]]; then
            "${site_check[@]}"
            exit 0
          fi

          for network_attempt in {1..3}; do
            if timeout 180 torsocks -i "${site_check[@]}"; then
              exit 0
            fi

            if (( network_attempt < 3 )); then
              echo "Connectivity attempt $network_attempt failed; restarting Tor."
              tor_restarted_at="$(date --utc '+%Y-%m-%d %H:%M:%S UTC')"
              sudo systemctl restart tor@default.service
              bootstrapped=0
              for bootstrap_attempt in {1..90}; do
                tor_logs="$(sudo journalctl -u tor@default.service \
                  --since "$tor_restarted_at" --no-pager)"
                if [[ "$tor_logs" == *"Bootstrapped 100%"* ]]; then
                  bootstrapped=1
                  break
                fi
                sleep 2
              done
              if (( ! bootstrapped )); then
                echo "Restarted Tor circuit did not fully bootstrap." >&2
              fi
            fi
          done

          echo "Official-site connectivity failed after three fresh Tor circuits." >&2
          exit 1

      - name: Collect missing results
        id: collect
        shell: bash
        env:
          START_DATE: ${{ github.event.inputs.start_date || '2020-04-02' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          REQUEST_DELAY: ${{ github.event.inputs.delay || '0.6' }}
        run: |
          set +e
          launcher=(python)
          if [[ -z "${THINHNAM_PROXY_URL:-}" ]]; then
            launcher=(torsocks -i python)
          fi

          command=("${launcher[@]}" -m result_scraper
            --start-date "$START_DATE"
            --output outputs/result_scraping/nam_dinh_results.xlsx
            --delay "$REQUEST_DELAY"
            --timeout 30
            --workers 3
            --checkpoint-every 25)
          if [[ -n "$END_DATE" ]]; then
            command+=(--end-date "$END_DATE")
          fi
          "${command[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit workbook checkpoints
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- outputs/result_scraping/nam_dinh_results.xlsx; then
            echo "Workbook is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/result_scraping/nam_dinh_results.xlsx
          git commit -m "data: update Nam Dinh lottery results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Report missing dates
        if: steps.collect.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "One or more dates remain missing. Saved results were committed and the next run will retry only missing dates."
          exit 1

